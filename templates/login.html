<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Coding Review Lab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Login Lab</h1>
    <p class="muted">3MTT Cybersecurity Capstone</p>
    {% if message %}<p class="error">{{ message }}</p>{% endif %}
    <form method="post" autocomplete="off">
      <label>Username</label>
      <input name="username" maxlength="32" required>
      <label>Password</label>
      <input name="password" type="password" maxlength="128" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
